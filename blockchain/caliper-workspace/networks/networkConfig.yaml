name: Caliper test
version: "2.0.0"

caliper:
  blockchain: fabric
  command:
    start: "docker-compose -f ../network/prometheus-grafana/docker-compose.yaml up -d"
    end: "docker-compose -f ../network/prometheus-grafana/docker-compose.yaml down"

channels:
  - channelName: mychannel
    contracts:
    - id: basic

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
      - name: 'User1'
        clientPrivateKey:
          path: '../network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/a6223125cf30e4147a91f735bcc2fa4c06f7c34e88a53199b7ab499f26e28cc5_sk'
        clientSignedCert:
          path: '../network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/cert.pem'
    connectionProfile:
      path: '../network/organizations/peerOrganizations/org1.example.com/connection-org1.yaml'
      discover: true
