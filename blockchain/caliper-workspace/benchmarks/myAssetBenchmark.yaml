test:
    name: basic-contract-benchmark
    description: test benchmark
    workers:
      number: 2
    rounds:
      - label: miniproject
        description: Read asset benchmark
        txNumber: 100
        rateControl:
          type: fixed-load
          opts:
            transactionLoad: 2
        workload:
          module: workload/readAsset.js
          arguments:
            assets: 20
            contractId: basic
    monitors:
      resource:
      - module: docker
        options:
          interval: 5
          containers:
          - all
          charting:
            bar:
              metrics: [Memory(avg), CPU%(avg)]
            polar:
              metrics: [all]
